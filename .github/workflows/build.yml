name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Detectar estructura del proyecto (ZIP o directa)
        run: |
          # Si existe un ZIP en la raíz se descomprime; si no, se usan los fuentes directos del repositorio
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "📦 Archivo ZIP encontrado: $ZIP_FILE"
            unzip "$ZIP_FILE" -d ./proyecto
            DIR=$(find ./proyecto -name "gradlew" -exec dirname {} \; | head -n 1)
            if [ -z "$DIR" ]; then
              DIR=$(find ./proyecto -name "build.gradle*" -exec dirname {} \; | head -n 1)
            fi
            echo "PROJECT_DIR=${DIR:-./proyecto}" >> $GITHUB_ENV
          else
            echo "ℹ️ No hay archivo .zip en la raíz. Usando los archivos fuente directos del repositorio."
            DIR=$(find . -maxdepth 2 -name "gradlew" -exec dirname {} \; | head -n 1)
            if [ -z "$DIR" ]; then
              DIR="."
            fi
            echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
          fi

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Dar permisos y Compilar APK
        run: |
          cd ${{ env.PROJECT_DIR }}
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            echo "⚠️ No se encontró gradlew ejecutable en $PROJECT_DIR"
          fi

      - name: Subir el APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug
          path: "**/app-debug.apk"
